name: Deploy to shared hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-shared
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and FTP deploy
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_mysql, tokenizer, xml, ctype, json, bcmath, fileinfo
          coverage: none
          tools: composer:v2

      - name: Build shared-hosting package
        run: node scripts/build-shared-deploy.mjs

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist-deploy/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          timeout: 600000
          exclude: |
            **/.env
            **/.env.*
            **/node_modules/**
            **/.git*
            **/storage/logs/**
            **/storage/framework/cache/data/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/storage/app/uploads/**
            !**/storage/app/uploads/.gitignore
